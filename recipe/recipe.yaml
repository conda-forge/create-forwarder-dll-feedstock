context:
  version: "0.11"

package:
  name: create-forwarder-dll
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/create-forwarder-dll/create_forwarder_dll-${{ version }}.tar.gz
  sha256: f1ceecffa970314d8850002d3c05fb84abc2f648e455b79474857b23adffff04

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - create-forwarder-dll = create_forwarder_dll:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65
    - setuptools-scm >=8.1
    - pip
  run:
    - python >=${{ python_min }}
    - setuptools >=65

tests:
  - python:
      imports:
        - create_forwarder_dll
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - create-forwarder-dll --help

about:
  homepage: https://github.com/isuruf/create-forwarder-dll
  summary: Creates a DLL that forwards all the symbols to another DLL
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - isuruf
